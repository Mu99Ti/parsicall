[project]
name = "parsicall"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["starlette>=0.40", "uvicorn>=0.30", "httpx>=0.27", "json-repair>=0.30", "jsonschema>=4.22", "persiantools>=6.0", "pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parsicall"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.12"
strict = true
packages = ["parsicall"]

[[tool.mypy.overrides]]
module = ["persiantools", "persiantools.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
